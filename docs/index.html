<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetVlc · Peligro de incendios AEMET</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9fe;
      color: #263238;
    }

    .page {
      max-width: 1200px;
      margin: 25px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }

    .header {
      background: linear-gradient(135deg, #0b2f4f 0%, #0b6fa4 65%, #ff6a2a 100%);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #e8f5ff;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 15px;
      background: #f6f9fb;
      border-bottom: 1px solid #dfe8ee;
    }

    .controls button {
      border: 0;
      padding: 9px 15px;
      border-radius: 10px;
      background: #0b2f4f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      transition: 0.2s ease;
    }

    .controls button:hover {
      background: #14527d;
    }

    .controls button.active {
      background: #ff6a2a;
    }

    #map {
      width: 100%;
      height: 720px;
      background: #dce8ee;
    }

    .legend {
      padding: 14px 18px;
      background: #ffffff;
      border-top: 1px solid #dfe8ee;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .legend span {
      display: inline-block;
      width: 18px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .meta {
      font-size: 13px;
      color: #51636d;
      padding: 0 18px 18px;
      background: #ffffff;
      text-align: center;
      line-height: 1.5;
    }

    @media screen and (max-width: 900px) {
      .header h1 {
        font-size: 21px;
      }

      #map {
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <h1>Peligro de incendios forestales</h1>
      <p>Producto georreferenciado oficial · Fuente: AEMET · Recorte Comunidad Valenciana</p>
    </div>

    <div class="controls" id="layerButtons">
      Cargando capas...
    </div>

    <div id="map"></div>

    <div class="legend">
      <b>Leyenda:</b>
      &nbsp;&nbsp;
      <span style="background:#4B96E3;"></span> Muy bajo
      &nbsp;&nbsp;
      <span style="background:#51D1F6;"></span> Bajo
      &nbsp;&nbsp;
      <span style="background:#57E520;"></span> Moderado
      &nbsp;&nbsp;
      <span style="background:#F9FB2F;"></span> Alto
      &nbsp;&nbsp;
      <span style="background:#EF8504;"></span> Muy alto
      &nbsp;&nbsp;
      <span style="background:#F52300;"></span> Extremo
    </div>

    <div class="meta" id="metadata">
      Cargando metadatos...
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let layersInfo = null;
    let currentOverlay = null;
    let cvGeoJson = null;
    let cvBoundaryLayer = null;
    let cvMaskLayer = null;
    let cvBounds = null;
    let updatedUTC = "";

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true
    }).setView([39.5, -0.5], 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 12,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    map.createPane("rasterPane");
    map.getPane("rasterPane").style.zIndex = 320;

    map.createPane("maskPane");
    map.getPane("maskPane").style.zIndex = 340;

    map.createPane("boundaryPane");
    map.getPane("boundaryPane").style.zIndex = 360;

    function dayLabel(day) {
      if (day === "D00") return "Hoy";
      if (day === "D01") return "Mañana";
      return day.replace("D", "D+");
    }

    function setActiveButton(day) {
      document.querySelectorAll(".controls button").forEach(btn => {
        btn.classList.remove("active");
      });

      const btn = document.getElementById("btn-" + day);
      if (btn) btn.classList.add("active");
    }

    function buildButtons(layers) {
      const container = document.getElementById("layerButtons");
      container.innerHTML = "";

      layers.forEach(layer => {
        const btn = document.createElement("button");
        btn.id = "btn-" + layer.day;
        btn.textContent = dayLabel(layer.day);
        btn.onclick = function() {
          drawLayer(layer);
        };
        container.appendChild(btn);
      });
    }

    function ringToLatLngs(ring) {
      return ring.map(coord => [coord[1], coord[0]]);
    }

    function getMainOuterRing(feature) {
      const geom = feature.geometry;

      if (geom.type === "Polygon") {
        return geom.coordinates[0];
      }

      if (geom.type === "MultiPolygon") {
        let best = null;
        let bestLen = 0;

        geom.coordinates.forEach(poly => {
          if (poly[0] && poly[0].length > bestLen) {
            best = poly[0];
            bestLen = poly[0].length;
          }
        });

        return best;
      }

      return null;
    }

    function drawCVBoundary(geojson) {
      if (cvBoundaryLayer) {
        map.removeLayer(cvBoundaryLayer);
      }

      cvBoundaryLayer = L.geoJSON(geojson, {
        pane: "boundaryPane",
        style: {
          color: "#0b2f4f",
          weight: 2.2,
          fill: false,
          opacity: 1
        }
      }).addTo(map);

      cvBounds = cvBoundaryLayer.getBounds();
    }

    function drawCVMask(geojson) {
      if (cvMaskLayer) {
        map.removeLayer(cvMaskLayer);
      }

      const feature = geojson.features[0];
      const outerRing = getMainOuterRing(feature);

      if (!outerRing) return;

      const outerWorld = [
        [90, -180],
        [90, 180],
        [-90, 180],
        [-90, -180]
      ];

      const hole = ringToLatLngs(outerRing);

      cvMaskLayer = L.polygon(
        [outerWorld, hole],
        {
          pane: "maskPane",
          stroke: false,
          fillColor: "#f9f9fe",
          fillOpacity: 0.92,
          interactive: false
        }
      ).addTo(map);
    }

    function drawLayer(layer) {
      if (!layer) return;

      if (currentOverlay) {
        map.removeLayer(currentOverlay);
      }

      const b = layer.bounds;

      const bounds = [
        [b.south, b.west],
        [b.north, b.east]
      ];

      currentOverlay = L.imageOverlay(layer.png, bounds, {
        pane: "rasterPane",
        opacity: 0.80,
        interactive: false
      }).addTo(map);

      setActiveButton(layer.day);

      if (cvBounds) {
        map.fitBounds(cvBounds, {
          padding: [10, 10]
        });
      } else {
        map.fitBounds(bounds, {
          padding: [15, 15]
        });
      }

      document.getElementById("metadata").innerHTML = `
        <b>Fuente:</b> AEMET ·
        <b>Capa:</b> ${dayLabel(layer.day)} ·
        <b>Archivo:</b> ${layer.source_file || ""}<br>
        Producto automático de peligro de incendios forestales basado en datos meteorológicos.
        Recorte visual centrado en la Comunitat Valenciana.
        <br><b>Actualizado:</b> ${updatedUTC || "—"}
      `;
    }

    Promise.all([
      fetch("layers.json?v=" + new Date().getTime()).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar layers.json");
        return r.json();
      }),
      fetch("cv.geojson?v=" + new Date().getTime()).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar cv.geojson");
        return r.json();
      })
    ])
    .then(([layersData, cvData]) => {
      layersInfo = layersData;
      cvGeoJson = cvData;
      updatedUTC = layersData.updated_utc || "";

      if (!layersData.layers || layersData.layers.length === 0) {
        throw new Error("layers.json no contiene capas");
      }

      drawCVBoundary(cvGeoJson);
      drawCVMask(cvGeoJson);

      buildButtons(layersData.layers);

      const firstLayer = layersData.layers[0];
      drawLayer(firstLayer);

      if (cvBounds) {
        map.setMaxBounds(cvBounds.pad(0.25));
      }
    })
    .catch(error => {
      document.getElementById("layerButtons").innerHTML =
        "No se han podido cargar las capas.";
      document.getElementById("metadata").innerHTML =
        "Error al cargar el producto de peligro de incendios AEMET.";
      console.error(error);
    });
  </script>

</body>
</html>
