<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetVlc · Peligro de incendios AEMET</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Necesario para intentar descargar la vista actual del mapa -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9fe;
      color: #263238;
    }

    .page {
      max-width: 1200px;
      margin: 25px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }

    .header {
      background: linear-gradient(135deg, #0b2f4f 0%, #0b6fa4 65%, #ff6a2a 100%);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #e8f5ff;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 15px;
      background: #f6f9fb;
      border-bottom: 1px solid #dfe8ee;
    }

    .controls button {
      border: 0;
      padding: 9px 15px;
      border-radius: 10px;
      background: #0b2f4f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      transition: 0.2s ease;
    }

    .controls button:hover {
      background: #14527d;
    }

    .controls button.active {
      background: #ff6a2a;
    }

    .download-controls {
      background: #ffffff;
      border-bottom: 1px solid #dfe8ee;
      padding-top: 10px;
      padding-bottom: 12px;
    }

    .download-controls button {
      background: #263d46;
    }

    .download-controls button:hover {
      background: #3f6f7a;
    }

    .download-controls button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #map {
      width: 100%;
      height: 720px;
      background: #dce8ee;
    }

    .legend {
      padding: 14px 18px;
      background: #ffffff;
      border-top: 1px solid #dfe8ee;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .legend span {
      display: inline-block;
      width: 18px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .meta {
      font-size: 13px;
      color: #51636d;
      padding: 0 18px 18px;
      background: #ffffff;
      text-align: center;
      line-height: 1.5;
    }

    @media screen and (max-width: 900px) {
      .header h1 {
        font-size: 21px;
      }

      #map {
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <h1>Peligro de incendios forestales</h1>
      <p>Producto georreferenciado oficial · Fuente: AEMET · Comunitat Valenciana</p>
    </div>

    <div class="controls" id="layerButtons">
      Cargando capas...
    </div>

    <div class="controls download-controls">
      <button id="downloadCurrentLayerBtn" type="button">
        Descargar imagen seleccionada
      </button>

      <button id="downloadMapViewBtn" type="button">
        Descargar vista actual del mapa
      </button>
    </div>

    <div id="map"></div>

    <div class="legend">
      <b>Leyenda:</b>
      &nbsp;&nbsp;
      <span style="background:#4B96E3;"></span> Muy bajo
      &nbsp;&nbsp;
      <span style="background:#51D1F6;"></span> Bajo
      &nbsp;&nbsp;
      <span style="background:#57E520;"></span> Moderado
      &nbsp;&nbsp;
      <span style="background:#F9FB2F;"></span> Alto
      &nbsp;&nbsp;
      <span style="background:#EF8504;"></span> Muy alto
      &nbsp;&nbsp;
      <span style="background:#F52300;"></span> Extremo
    </div>

    <div class="meta" id="metadata">
      Cargando metadatos...
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let layersInfo = null;
    let currentOverlay = null;
    let currentLayerInfo = null;
    let cvGeoJson = null;
    let cvBoundaryLayer = null;
    let cvBounds = null;
    let updatedUTC = "";

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true
    }).setView([39.5, -0.5], 8);

    const osm = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        crossOrigin: true,
        attribution: "&copy; OpenStreetMap"
      }
    );

    const esriTopo = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 18,
        crossOrigin: true,
        attribution: "Tiles &copy; Esri"
      }
    );

    const openTopo = L.tileLayer(
      "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 17,
        crossOrigin: true,
        attribution: "Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap"
      }
    );

    esriTopo.addTo(map);

    const baseMaps = {
      "Relieve · Esri": esriTopo,
      "Topográfico · OpenTopo": openTopo,
      "Calles · OSM": osm
    };

    L.control.layers(baseMaps, null, {
      collapsed: false
    }).addTo(map);

    map.createPane("rasterPane");
    map.getPane("rasterPane").style.zIndex = 320;

    map.createPane("boundaryPane");
    map.getPane("boundaryPane").style.zIndex = 360;

    function formatPeninsularTime(isoString) {
      if (!isoString) return "—";

      const date = new Date(isoString);

      if (isNaN(date.getTime())) {
        return isoString;
      }

      return new Intl.DateTimeFormat("es-ES", {
        timeZone: "Europe/Madrid",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZoneName: "short"
      }).format(date);
    }

    function formatDateFromLayer(layer) {
      if (!layer || !layer.date) {
        return "";
      }

      /*
        layer.date ya viene calculado correctamente desde process_aemet_peligro.py.

        Ejemplo:
        D00 -> 20260530
        D01 -> 20260531
        D02 -> 20260601

        Aquí NO se suma otra vez el offset D00/D01/D02.
      */

      const year = layer.date.slice(0, 4);
      const month = layer.date.slice(4, 6);
      const day = layer.date.slice(6, 8);

      return `${day}/${month}/${year}`;
    }

    function dayLabel(layer) {
      const fecha = formatDateFromLayer(layer);

      if (!fecha) {
        return layer.day || "";
      }

      return fecha;
    }

    function safeFileName(text) {
      return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9_-]+/g, "_")
        .replace(/^_+|_+$/g, "");
    }

    function setActiveButton(day) {
      document.querySelectorAll(".controls button").forEach(btn => {
        btn.classList.remove("active");
      });

      const btn = document.getElementById("btn-" + day);
      if (btn) btn.classList.add("active");
    }

    function buildButtons(layers) {
      const container = document.getElementById("layerButtons");
      container.innerHTML = "";

      layers.forEach(layer => {
        const btn = document.createElement("button");
        btn.id = "btn-" + layer.day;
        btn.textContent = dayLabel(layer);
        btn.onclick = function() {
          drawLayer(layer);
        };
        container.appendChild(btn);
      });
    }

    function drawCVBoundary(geojson) {
      if (cvBoundaryLayer) {
        map.removeLayer(cvBoundaryLayer);
      }

      cvBoundaryLayer = L.geoJSON(geojson, {
        pane: "boundaryPane",
        style: {
          color: "#0b2f4f",
          weight: 2.2,
          fill: false,
          opacity: 1
        }
      }).addTo(map);

      cvBounds = cvBoundaryLayer.getBounds();
    }

    function drawLayer(layer) {
      if (!layer) return;

      currentLayerInfo = layer;

      if (currentOverlay) {
        map.removeLayer(currentOverlay);
      }

      const b = layer.bounds;

      const bounds = [
        [b.south, b.west],
        [b.north, b.east]
      ];

      const cacheKey = updatedUTC || new Date().getTime();
      const pngUrl = layer.png + "?v=" + encodeURIComponent(cacheKey);

      currentOverlay = L.imageOverlay(pngUrl, bounds, {
        pane: "rasterPane",
        opacity: 0.90,
        interactive: false,
        crossOrigin: true
      }).addTo(map);

      setActiveButton(layer.day);

      if (cvBounds) {
        map.fitBounds(cvBounds, {
          padding: [10, 10]
        });
      } else {
        map.fitBounds(bounds, {
          padding: [15, 15]
        });
      }

      document.getElementById("metadata").innerHTML = `
        <b>Fuente:</b> AEMET ·
        <b>Fecha:</b> ${dayLabel(layer)} ·
        <b>Archivo:</b> ${layer.source_file || ""}<br>
        Producto automático de peligro de incendios forestales basado en datos meteorológicos.
        Recorte real a la Comunitat Valenciana.
        <br><b>Actualizado:</b> ${formatPeninsularTime(updatedUTC)} hora peninsular
      `;
    }

    function downloadCurrentLayer() {
      if (!currentLayerInfo || !currentLayerInfo.png) {
        alert("Todavía no hay ninguna imagen seleccionada.");
        return;
      }

      const cacheKey = updatedUTC || new Date().getTime();
      const url = currentLayerInfo.png + "?v=" + encodeURIComponent(cacheKey);

      const fileDate = safeFileName(formatDateFromLayer(currentLayerInfo) || currentLayerInfo.day || "actual");
      const fileName = "Peligro_incendios_AEMET_CV_" + fileDate + ".png";

      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function downloadMapView() {
      const btn = document.getElementById("downloadMapViewBtn");
      const oldText = btn.textContent;

      btn.disabled = true;
      btn.textContent = "Generando imagen...";

      try {
        map.invalidateSize();

        const mapElement = document.getElementById("map");

        const canvas = await html2canvas(mapElement, {
          useCORS: true,
          allowTaint: false,
          backgroundColor: null,
          logging: false,
          scale: 2
        });

        const fileDate = currentLayerInfo
          ? safeFileName(formatDateFromLayer(currentLayerInfo) || currentLayerInfo.day || "actual")
          : "actual";

        const link = document.createElement("a");
        link.download = "Vista_mapa_peligro_incendios_AEMET_CV_" + fileDate + ".png";
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (error) {
        alert(
          "No se ha podido generar la vista completa del mapa. " +
          "Algunos mapas base externos bloquean la descarga por permisos CORS. " +
          "Puedes descargar la imagen seleccionada, que es la opción más fiable."
        );
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    document.getElementById("downloadCurrentLayerBtn")
      .addEventListener("click", downloadCurrentLayer);

    document.getElementById("downloadMapViewBtn")
      .addEventListener("click", downloadMapView);

    Promise.all([
      fetch("layers.json?v=" + new Date().getTime()).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar layers.json");
        return r.json();
      }),
      fetch("cv.geojson?v=" + new Date().getTime()).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar cv.geojson");
        return r.json();
      })
    ])
    .then(([layersData, cvData]) => {
      layersInfo = layersData;
      cvGeoJson = cvData;
      updatedUTC = layersData.updated_utc || "";

      if (!layersData.layers || layersData.layers.length === 0) {
        throw new Error("layers.json no contiene capas");
      }

      drawCVBoundary(cvGeoJson);
      buildButtons(layersData.layers);

      const firstLayer = layersData.layers[0];
      drawLayer(firstLayer);

      if (cvBounds) {
        map.setMaxBounds(cvBounds.pad(0.25));
      }
    })
    .catch(error => {
      document.getElementById("layerButtons").innerHTML =
        "No se han podido cargar las capas.";
      document.getElementById("metadata").innerHTML =
        "Error al cargar el producto de peligro de incendios AEMET.";
      console.error(error);
    });
  </script>

</body>
</html>
